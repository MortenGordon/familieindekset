name: Hent artikler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hent-artikler
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Hent feeds
        run: node scripts/hent.mjs

      - name: Gem hvis der er nyt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artikler.json
          if git diff --staged --quiet; then
            echo "Ingen aendringer"
          else
            git commit -m "Opdater artikler ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
